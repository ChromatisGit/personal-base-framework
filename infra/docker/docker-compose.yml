# Template — copy to project root and fill in the values below.
# Variables sourced from a .env file in the project root:
#   APP_NAME        e.g. myapp
#   DOCKER_DATABASE_URL  e.g. postgres://myapp:secret@db:5432/myapp
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${APP_NAME}
      POSTGRES_USER: ${APP_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_NAME} -d ${APP_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      DB_DRIVER: node
      DB_AUTO_INIT: "0"
    ports:
      - "3000:3000"

volumes:
  pgdata:
